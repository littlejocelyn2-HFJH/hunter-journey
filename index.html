<meta name="viewport" content="width=device-width, initial-scale=1">
<title>〈獵人〉山林旅程｜九年級國文</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<script src="config.js?v=2"></script>
<style>
:root{
  --paper:#f5f0e6; --paper2:#ebe3d3; --ink:#232b26; --mute:#6b706a; --line:#d8cdb8;
  --moss:#4a6650; --moss-d:#34493a; --ember:#bf6b33; --ember-l:#f0c38f; --night:#0c110e; --warn:#a4462c;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font-family:inherit;font-size:17px;color:var(--ink)}
a{color:var(--moss)}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 60px}

/* 頁首 */
.top{position:sticky;top:0;z-index:20;background:rgba(245,240,230,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .in{max-width:980px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;min-height:52px}
.top .ttl{font-family:var(--serif);font-weight:700;white-space:nowrap;margin-right:6px;color:var(--ink);text-decoration:none}
.top .home{margin-left:auto;font-size:14px;text-decoration:none;white-space:nowrap}
.leg{flex:1;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);min-width:0}
.leg .bar{flex:1;height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.leg .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--moss);transition:width .4s}
.leg.on{color:var(--ink);font-weight:600}
.leg span{white-space:nowrap}
@media (max-width:700px){.top .ttl.j{display:none}.leg span{font-size:12px}}

h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:.02em}
h1{font-size:40px;margin:44px 0 6px}
h2{font-size:26px;margin:6px 0 4px}
h3{font-size:19px}
.kicker{font-size:14px;color:var(--moss);letter-spacing:.08em;margin-top:28px}
.lead{font-family:var(--serif);font-size:18px;line-height:1.9;color:#3a413c}
.mute{color:var(--mute)}
.btn{border:1px solid var(--moss);background:var(--moss);color:#fff;border-radius:999px;padding:12px 26px;min-height:46px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--moss)}
.btn.ember{background:var(--ember);border-color:var(--ember)}
.btn.big{font-size:19px;padding:16px 34px;min-height:60px}
.btn.sm{padding:6px 14px;min-height:34px;font-size:14px;font-weight:500}
.btn.danger{background:transparent;color:var(--warn);border-color:var(--warn)}
.card{background:#fffdf8;border:1px solid var(--line);border-radius:14px;padding:20px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mute);min-width:0}
.field input,.field textarea,.field select{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;line-height:1.8;resize:vertical;min-height:110px}
input:focus,textarea:focus{outline:2px solid var(--ember-l);border-color:var(--ember)}
.step-label{display:flex;align-items:center;gap:10px;margin:26px 0 10px;font-weight:600}
.step-label b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;color:var(--ink);min-height:40px;text-align:left}
.chip:hover{border-color:var(--ember)}
.tag{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;color:#4a514b;margin:0 6px 6px 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:90;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.note{font-size:14px;color:var(--mute);line-height:1.7}
.err{color:var(--warn);font-size:15px;line-height:1.7}

/* 主畫面 */
.home-hero{padding:10px 0 6px}
.home-btns{display:flex;flex-wrap:wrap;gap:14px;margin:26px 0}
.welcome{background:#fffdf8;border:1px solid var(--line);border-left:4px solid var(--moss);border-radius:10px;padding:14px 18px;margin-top:18px;font-size:16px;line-height:1.8}
.steps{counter-reset:s;list-style:none;padding:0;margin:10px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.steps li{background:#fffdf8;border:1px solid var(--line);border-radius:12px;padding:16px;font-size:15px;line-height:1.75;color:#4a514b}
.steps li b{display:block;font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:4px}
@media (max-width:700px){.steps{grid-template-columns:1fr}}

/* 視窗 */
.modal{position:fixed;inset:0;background:rgba(20,24,21,.45);z-index:60;display:grid;place-items:center;padding:20px}
.modal .box{background:var(--paper);border-radius:16px;padding:26px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .box.wide{max-width:900px;max-height:92vh;overflow:auto}
.modal .row3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.modal .row3 .full{grid-column:1/-1}

/* 第一部分 */
.lenses{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lens-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:74px}
.lens-btn .ln{font-family:var(--serif);font-weight:700;font-size:19px}
.lens-btn .ld{font-size:13px;color:var(--mute);line-height:1.5}
.lens-btn.on{border-color:var(--ember);box-shadow:0 0 0 2px var(--ember-l) inset;background:#fffaf2}
.lens-fb{font-size:15px;line-height:1.8;color:#4a514b;background:var(--paper2);border-radius:10px;padding:10px 14px;margin:10px 0 0}
.lens-fb:empty{display:none}
.scene{position:relative;background:var(--night);border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;--x:50%;--y:30%;--r:120px}
.scene .text{position:relative;padding:30px 34px 36px;font-family:var(--serif);color:#ece5d2;line-height:2.05;font-size:20px;transition:font-size .3s}
.scene.lens-wide .text{font-size:17px}
.scene.lens-mid .text{font-size:20px}
.scene.lens-macro .text{font-size:24px}
.scene .pno{display:inline-block;font-size:12px;color:#8e9a8f;border:1px solid #3c4a40;border-radius:4px;padding:0 5px;margin-right:8px;line-height:1.6;vertical-align:middle;font-family:var(--sans)}
.scene p{margin:0 0 14px}
.scene .clue{border-bottom:1px dashed rgba(240,195,143,.55);cursor:pointer}
.scene .clue.found{background:rgba(240,195,143,.22);border-bottom:2px solid var(--ember-l);color:#fff3dc}
.scene .shade{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle var(--r) at var(--x) var(--y),rgba(255,214,150,.07) 0%,rgba(255,214,150,.03) 55%,rgba(7,10,8,.965) 100%)}
.scene.lens-off .shade{background:rgba(7,10,8,.985)}
.scene .off-msg{position:absolute;inset:0;display:grid;place-items:center;color:#a8b0a6;font-size:17px;pointer-events:none;letter-spacing:.05em}
.bag{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bag .item{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ember);border-radius:8px;padding:10px 14px}
.bag .q{font-family:var(--serif);font-weight:600}
.bag .n{font-size:14px;color:var(--mute);margin-top:4px;line-height:1.7}
.bag .empty{font-size:14px;color:var(--mute)}
.rec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
@media (max-width:700px){.rec-grid,.lenses{grid-template-columns:1fr}}
.st-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
.gate{font-size:14px;color:var(--ember);text-align:center;flex:1}

/* 第二部分 */
.p2-grid{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start;margin-top:18px}
@media (max-width:820px){.p2-grid{grid-template-columns:1fr}}
.wheel-box{display:flex;flex-direction:column;align-items:center;gap:14px}
.wheel-wrap{position:relative;width:290px;height:290px}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--ember);z-index:3}
.wheel{width:290px;height:290px;border-radius:50%;position:relative;border:6px solid #2d3a31;transition:transform 3.2s cubic-bezier(.16,.84,.26,1);
  background:conic-gradient(#dfe5d6 0 45deg,#cfd8c6 45deg 90deg,#dfe5d6 90deg 135deg,#cfd8c6 135deg 180deg,#dfe5d6 180deg 225deg,#cfd8c6 225deg 270deg,#dfe5d6 270deg 315deg,#cfd8c6 315deg 360deg)}
.wheel .lab{position:absolute;left:50%;top:50%;width:0;height:0}
.wheel .lab span{position:absolute;left:-40px;top:-128px;width:80px;text-align:center;font-family:var(--serif);font-size:14px;font-weight:700;color:#2d3a31;line-height:1.25}
.wheel .lab.used span{color:#9aa496;text-decoration:line-through}
.wheel .hub{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#2d3a31;color:var(--paper);display:grid;place-items:center;font-size:12px}
.claim{background:#2b2420;color:#f3eadb;border-radius:14px;padding:18px 20px}
.claim .who{font-size:13px;color:#cdb79b;letter-spacing:.08em}
.claim .say{font-family:var(--serif);font-size:20px;line-height:1.8;margin:6px 0 8px}
.sdg{display:inline-block;font-size:12px;border:1px solid #8c7a63;border-radius:4px;padding:1px 6px;margin-right:6px;color:#e2cfb3}
.arrows{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (max-width:560px){.arrows{grid-template-columns:1fr}}
.arrow-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;text-align:left;min-height:84px}
.arrow-btn .an{font-family:var(--serif);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.arrow-btn .an::before{content:"";width:22px;height:2px;background:var(--ink);display:inline-block}
.arrow-btn .aq{font-size:13px;color:var(--mute);line-height:1.6;margin-top:4px}
.arrow-btn.last{border-color:var(--ember);background:#fffaf2}
.arrow-btn:disabled{opacity:.45}
.target-row{display:flex;gap:16px;align-items:center;margin-top:14px;flex-wrap:wrap}
.target{position:relative;width:200px;height:200px;flex:none}
.target svg{width:200px;height:200px}
.dart{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ember);border:2px solid #fff;box-shadow:0 0 0 1px var(--ember);transition:left .55s cubic-bezier(.3,.7,.3,1),top .55s cubic-bezier(.3,.7,.3,1)}
.dart.old{background:#8b8f88;box-shadow:none;opacity:.6;transition:none}
.dart.na{background:#9aa09a;box-shadow:none}
.fb{flex:1;min-width:220px;font-size:15px;line-height:1.85}
.fb .lv{font-family:var(--serif);font-weight:700;font-size:18px;margin-bottom:4px}
.rounds{margin-top:22px}
.rounds .r{border-top:1px solid var(--line);padding:10px 0;font-size:14px;line-height:1.7}
.rounds .r b{font-family:var(--serif)}

/* 第三部分 */
.p3-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start;margin-top:16px}
@media (max-width:900px){.p3-grid{grid-template-columns:1fr}}
.preview img{width:100%;display:block;border-radius:8px;box-shadow:0 10px 30px rgba(40,35,25,.18)}
.bgs{display:flex;gap:10px}
.bgs button{flex:1;border:2px solid transparent;border-radius:10px;padding:0;overflow:hidden;background:none}
.bgs button.on{border-color:var(--ember)}
.bgs canvas{width:100%;display:block}
.bgs small{display:block;font-size:13px;padding:4px 0;background:#fff;color:var(--ink)}
.orig{font-size:14px;color:var(--mute);margin-top:6px;line-height:1.7}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--moss);transition:width .3s}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.code-box{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:160px;overflow:auto}

/* 報告書 */
.report{background:#fffdf8;border:1px solid var(--line);border-radius:14px;padding:30px 34px;margin-top:20px}
.report h2{margin:0}
.report .meta{color:var(--mute);font-size:15px;margin-top:6px}
.report section{margin-top:22px}
.report h3{margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.report ul{margin:6px 0;padding-left:1.3em;line-height:1.9}
.report p{line-height:1.9;margin:6px 0}
.levels{display:flex;gap:10px;flex-wrap:wrap}
.level{flex:1;min-width:150px;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:#fff}
.level .ic{font-size:26px;line-height:1}
.level.ok{border-color:var(--moss);background:#f0f4ee}
.level b{display:block;font-family:var(--serif);margin-top:6px}
.ans-row{border-top:1px dashed var(--line);padding:8px 0;font-size:15px;line-height:1.8}

/* 成績頁 */
.tbl{width:100%;border-collapse:collapse;font-size:15px;background:#fff;border-radius:10px;overflow:hidden}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--paper2);font-weight:600;font-size:14px}
.tbl tr.flag td{background:#fbf0ea}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.cls-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.cls-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;min-height:38px}
.cls-tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.login{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fffdf8;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:16px}
.login input{border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:180px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools label{font-size:14px;display:flex;gap:6px;align-items:center}
.tools input[type=number]{width:90px;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.bars .b{display:grid;grid-template-columns:170px 1fr 60px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.bars .t{height:14px;background:var(--paper2);border-radius:7px;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--moss)}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--paper2)}
.stack i{display:block;height:100%}
.legend{font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:middle}

/* 大屏（淺色底） */
body.screen-mode{background:#f7f1e4}
.scr{padding:22px 34px 30px;max-width:1700px;margin:0 auto}
.scr-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.scr-head h1{margin:0;font-size:44px}
.scr-head select{font-size:26px;padding:6px 14px;border-radius:10px;border:2px solid #2f3a33;background:#fff}
.scr-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:22px 0}
.scr-num{background:#fff;border-radius:16px;padding:18px 22px;border:2px solid #e2d6bf}
.scr-num .v{font-family:var(--serif);font-size:64px;font-weight:700;color:#1d2a22;line-height:1.1}
.scr-num .k{font-size:22px;color:#4b524d}
.scr-grid{display:grid;grid-template-columns:1.2fr 1fr 0.8fr;gap:18px}
.scr-panel{background:#fff;border-radius:16px;padding:18px 22px;border:2px solid #e2d6bf}
.scr-panel h2{font-size:28px;margin:0 0 12px}
.scr-row{display:grid;grid-template-columns:190px 1fr;gap:12px;align-items:center;margin:10px 0;font-size:21px}
.scr-row .stack{height:28px;border-radius:8px}
.scr-row .t{height:28px;background:#efe6d4;border-radius:8px;overflow:hidden;position:relative}
.scr-row .t i{display:block;height:100%;background:#2f6b4a}
.scr-row .t em{position:absolute;right:10px;top:0;line-height:28px;font-style:normal;font-weight:700;color:#1d2a22}
.scr-top li{font-size:26px;line-height:1.9;font-family:var(--serif)}
.scr-foot{margin-top:16px;color:#4b524d;font-size:18px;display:flex;justify-content:space-between}
@media (max-width:1100px){.scr-grid{grid-template-columns:1fr}.scr-nums{grid-template-columns:repeat(2,1fr)}}

.foot{text-align:center;margin-top:40px;font-size:13px;color:var(--mute)}
.foot button{background:none;border:none;color:var(--mute);text-decoration:underline;font-size:13px}

@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  .top,.noprint,.toast{display:none!important}
  .wrap{max-width:none;padding:0}
  .report{border:none;padding:0;margin:0;font-size:12.5px}
  .report p,.report ul{line-height:1.65}
  .report section{margin-top:12px;break-inside:avoid}
  .modal{position:static;background:none;padding:0}
  .modal .box{box-shadow:none;max-height:none;padding:0;background:#fff}
  body.has-modal #app{display:none}
}
</style>
</head>
<body>
<header class="top"><div class="in" id="topbar"></div></header>
<main id="app"></main>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<canvas id="pc" width="1200" height="800" style="display:none"></canvas>

<script>
/* ============ 後端設定 ============ */
const API = ((window.MZ_CONFIG||{}).sheetApi||"").trim();
const LOCAL = !API;

/* ============ 課文（康軒版 瓦歷斯‧諾幹〈獵人〉） ============ */
const TEXT = {
1:"我們抵達八雅鞍部山脈的肩膀時，整片天空宛如張大翅膀的蒼鷹迅速撲掠而下。向上望，濃密而深黑的樹林沉靜地霸占山頭，透過樹群的空隙，山腳下但見山谷或深或淺的輪廓。",
2:"「生火。」雅隆‧諾基斯把命令像流星拋進我的耳朵裡，身影已像是隻蝙蝠飄然消逝在林子裡。",
3:"我希望能夠討好獵人，手腳伶俐地尋到幾堆柴火，耗費了幾根火柴棒才把地表的潮氣趕走，幾點星火緩緩地自柴堆中冒起。這時候，老獵人枯藤一般的左手已拎了隻狐狸，肩上負著兩隻飛鼠，愉快地對我說：「我知道你會帶來好運氣，雖然你在都市中生活，仍是泰雅鍾愛的孩子。」",
4:"事實上，我已年近三十，利用學校暑假的空檔，央求雅爸無論如何一定要替我完成泰雅成年禮的見證。國中畢業後，一直就在外地求學、服務，泰雅的子民卻無法親自領受傳統禮儀，一直是我心中的遺憾。雅爸邀請雅隆‧諾基斯到家中述明我渴求的願望，年近八十的老獵人離去的時候，要我一早準備番刀和鹽巴就好。",
5:"我一邊撥著火，一邊看獵人嫻熟地處理狐狸。「狩獵對泰雅男人是莊嚴的事，沒有獵物就餵不飽你的家人，也證明這個男人失去勇武犯難的精神，泰雅是在戰鬥中生存下來的。」黯夜中，老獵人以最原始的方法完成一頓晚餐，狐狸肉不加任何都市或科技的添加物，只消沾上粗鹽入口，便是道可口的肉食。",
6:"入睡前，寒意愈加沉重，老獵人吩咐不得讓篝火停息：「黑暗是森林的鬼魅，它會趁你不注意的時候凍結身體的血液，第二天，黑夜的使者──山豬，便把失去靈魂的軀殼叨走。」老獵人依然絮絮叨叨地說出成年禮的諸多禁忌。「你只許有一把番刀，前去尋找山豬的一對利牙。」我迷迷糊糊地入睡，根本就忘了篝火熄滅的預言，只覺得徹夜出奇地溫暖。",
7:"黯夜消失，我也沒被山豬叨走。金陽猶在山的床褥裡掙扎，老獵人早已整理好營地，要我獨自進入山的心臟地帶。失去了老獵人的陪伴，我便像是在大海中猶豫的扁舟，哪裡才有老獵人的獵物呢？",
8:"芒草擦過肌膚，馬上就泌出明亮的血痕，為了不使血腥味觸動野獸的鼻子，我順手搓揉了藥草抹去。我取下堅實的櫸木，製作一些堅固而實用的長矛。來到山谷地，一彎溪水流瀉著山的音符，溼潤的泥地可發現不同的蹄跡。我慶幸發現了牠的蹤跡，逆著風跟隨牠的腳步，全身的血液快速流轉在緊握長矛的手掌上，我興奮著自己將要成為「泰雅」。",
9:"我看見牠了，牠必然也感覺到我的存在。在牠轉身剎那，我的長矛像頭豹奔出去，牠受傷的前蹄憤怒地跨過來，把我的身軀像葉片般撥開。",
10:"穿過樹林，陽光把一盆火當頭罩下來，鹹澀的汗水侵凌傷口，我只好先以爛泥和腐葉裹傷。疲憊地穿行山林間，可以感覺到似乎有一對眼睛審視著我，一刻不曾稍停，我懷疑是不是老獵人？數度轉身，只有山中偶爾傳來鳥雀的鳴聲。我重新回到山谷地，選擇芒草覆蓋的巨岩背後，從草徑的縫隙，可以清楚地看見溪水的一切。「等待是獵人的美德」，我像壁虎般趴著伏著。黃昏，牠必須前來飲水，到時候，我將給牠致命的一擊。",
11:"「來了！」我聽見草叢分撥的聲音，聽到悶雷般的吼聲。我揉亮眼睛，不錯，果真是牠，隨後，還有三隻淘氣的小山豬……。",
12:"重回營地，老獵人逕自生起篝火，遠遠看去，彷彿那是尊千百年來就在此庇佑山林的神祇。我心虛地靠坐過去，想到老獵人所說，狩獵後家族將以戰歌和小米酒迎接，我頹然地怨恨自己因為一時心軟而失去作為「泰雅」的榮譽。",
13:"「還懊惱著嗎？」老獵人把醃了許久的飛鼠肉遞過來，我用沉默代替回答。",
14:"「牠是這座山最後的山豬，也是最凶猛的。」老獵人自言自語般，繼續說下去：「勇敢、智慧與愛就是一個好獵人的全部財產。」老獵人戲謔地補充說：「何況山裡只有這一頭勇猛的山豬，你獵到了，以後泰雅的小孩要獵什麼？」",
15:"在八雅鞍部山脈的肩膀，這夜晚一如泰雅的每一個夜晚，老獵人指引著年輕人的腳步，許多山林的故事便在耳傳口述中綿綿不止。"

const errMsg = e=>ERR[e]||("發生錯誤："+e);
function fmtTime(iso){if(!iso)return "";const d=new Date(iso);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
function fmtDur(sec){sec=Math.round(sec||0);const m=Math.floor(sec/60),s=sec%60;return m?`${m} 分 ${s} 秒`:`${s} 秒`}
function copyText(t,msg){
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();toast(ok?msg:"複製失敗，請再試一次")};
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(()=>toast(msg),fallback); else fallback();
}

/* ============ API（Apps Script；未設定時為本機模式） ============ */
async function api(action,data={}){
  if(LOCAL) return localApi(action,data);
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...data})});
    return await r.json();
  }catch(e){return {ok:false,error:"network"}}
}
/* 本機模式：只供介面試用，不計分 */
const LKEY="hunter-localdb";
function ldb(){try{return JSON.parse(localStorage.getItem(LKEY))||{rows:[]}}catch(e){return {rows:[]}}}
function lsave(d){try{localStorage.setItem(LKEY,JSON.stringify(d))}catch(e){}}
function analyzeLocal(rec){
  const p1Words=rec.p1.reduce((t,x)=>t+clen(x.thought)+clen(x.did)+clen(x.said)+clen(x.mood),0);
  const p2Words=rec.p2.reduce((t,x)=>t+clen(x.reason),0), p3Words=clen(rec.p3.text);
  const p1Done=rec.p1.length===7&&rec.p1.every(x=>x.lens&&x.clues.length&&clen(x.thought)>=10);
  const parts=[p1Done,rec.p2.length>=3,p3Words>=20];
  return {p1Words,p2Words,p3Words,words:p1Words+p2Words+p3Words,clues:rec.p1.reduce((t,x)=>t+x.clues.length,0),
    rounds:rec.p2.map(x=>({id:x.id,shots:x.shots.length})),bulls:0,parts,partsDone:parts.filter(Boolean).length};
}
function localApi(action,d){
  const db=ldb();
  if(action==="check") return {ok:true,already:false};
  if(action==="judge") return {ok:false,error:"local"};
  if(action==="save"){
    const ts=new Date().toISOString(),ana=analyzeLocal(d.record);
    let r=db.rows.find(x=>x.cls===d.student.cls&&+x.seat===+d.student.seat);
    if(!r){r={cls:d.student.cls,seat:+d.student.seat,name:d.student.name,attempts:[]};db.rows.push(r)}
    r.name=d.student.name;r.attempts.push({ts,name:d.student.name,rec:d.record,ana});r.attempts=r.attempts.slice(-20);lsave(db);
    return {ok:true,ts,report:{student:d.student,ts,rec:d.record,ana,published:false,answers:null}};
  }
  if(action==="report"){const r=db.rows.find(x=>x.cls===d.student.cls&&+x.seat===+d.student.seat);if(!r)return{ok:false,error:"not-found"};const a=r.attempts.at(-1);return{ok:true,report:{student:d.student,ts:a.ts,rec:a.rec,ana:a.ana,published:false,answers:null}}}
  if(action==="list"){if(d.password)return{ok:false,error:"local"};return{ok:true,teacher:false,published:false,board:db.rows.filter(r=>r.attempts.length).map(r=>{const a=r.attempts.at(-1);return{cls:r.cls,seat:r.seat,name:r.name,partsDone:a.ana.partsDone,words:a.ana.words,bulls:0,stamp:a.rec.p3.stamp}})}}
  if(action==="stats"){
    const classes={};db.rows.forEach(r=>{if(r.attempts.length)classes[r.cls]=(classes[r.cls]||0)+1});
    const mine=db.rows.filter(r=>r.cls===d.cls&&r.attempts.length);
    const lens=STATIONS.map(()=>({wide:0,mid:0,macro:0}));const stamps={guard:0,learn:0};
    mine.forEach(r=>{const a=r.attempts.at(-1);a.rec.p1.forEach((x,i)=>{if(x.lens)lens[i][x.lens]++});if(stamps[a.rec.p3.stamp]!=null)stamps[a.rec.p3.stamp]++});
    return{ok:true,classes,cls:d.cls,count:mine.length,finished:mine.filter(r=>r.attempts.at(-1).ana.partsDone===3).length,lens,stamps,
      claims:CLAIMS.map(c=>({tag:c.tag,n:0,bulls:0})),top:mine.map(r=>({seat:r.seat,name:r.name,words:r.attempts.at(-1).ana.words})).sort((a,b)=>b.words-a.words).slice(0,5)};
  }
  return {ok:false,error:"local"};
}

function registerModal(){
  const s=state.student||{};
  openModal(`<h2 style="margin-top:0">登記你的班級座號</h2>
   <p class="note">登記後開始旅程。資料會交給老師，請確實填寫。</p>

     <label class="field">座號<input id="rSeat" inputmode="numeric" value="${esc(s.seat)}" placeholder="1～60"></label>
     <label class="field full">姓名<input id="rName" value="${esc(s.name)}" maxlength="20" placeholder="你的名字"></label>
   </div>
   <div class="err" id="rErr"></div>
   <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px">
     <a href="#" class="note">取消</a>
     <button class="btn" id="rGo">開始旅程</button>
   </div>
   <p style="margin:18px 0 0;font-size:14px"><a href="#scores">我是老師，先略過，直接看班級成績 →</a></p>`);
  $("#rGo").onclick=async()=>{
    const cls=$("#rCls").value.trim(), seat=parseInt($("#rSeat").value,10), name=$("#rName").value.trim();
    const e=$("#rErr");
    if(!/^\d{3,4}$/.test(cls)){e.textContent="班級請填 3～4 位數字，例如 901。";return}
    if(!(seat>=1&&seat<=60)){e.textContent=ERR["bad-seat"];return}
    if(!name){e.textContent=ERR["bad-name"];return}
    $("#rGo").disabled=true;e.textContent="確認中……";
    const res=await api("check",{student:{cls,seat,name}});

    if(!res.ok){e.textContent=errMsg(res.error);return}

/* ============ 學生旅程 ============ */
function quiz(){
  if(!state.student){topbar("home");homePage();registerModal();return}
  if(state.submitted){statusPage();return}
  if(!state.t.start){state.t.start=Date.now();save()}
  renderStep();
}

  topbar("home");

function go(step){
  if(step==="p2"&&!state.t.p1) state.t.p1=Date.now();
  if(step==="p3"&&!state.t.p2) state.t.p2=Date.now();
  state.step=step;save();renderStep();window.scrollTo(0,0);
}
function renderStep(){
  topbar("quiz");
  const s=state.step;
  if(s.startsWith("s")) renderStation(+s.slice(1));
  else if(s==="p2") renderP2();
  else renderP3();
}

/* ---------- 第一部分 ---------- */
function paraHTML(st){
  return st.paras.map(n=>{
    let h=esc(TEXT[n]);
    st.clues.forEach((c,ci)=>{h=h.replace(esc(c.t),`<span class="clue" data-ci="${ci}">${esc(c.t)}</span>`)});
    return `<p><span class="pno">${CN[n]}</span>${h}</p>`;
  }).join("");
}
function lensFeedback(st,d){
  if(!d.lens) return "";
  const me=LENS[d.lens], sug=LENS[st.lens];
  if(d.lens===st.lens) return `你和作者的鏡頭很靠近。${st.why}`;
  return `你選了<b>${me.name}</b>：${me.desc}。作者在這裡比較像用<b>${sug.name}</b>——${st.why} 兩種看法都可以，寫下你從自己的鏡頭看見了什麼。`;
}
function ownLen(text,starters){let o=text||"";starters.forEach(s=>{o=o.split(s).join("")});return clen(o)}
function renderStation(i){
  const st=STATIONS[i], d=state.p1[i];
  app.innerHTML=`<div class="wrap">
  <div class="kicker">第一部分｜文章、手電筒、鏡頭　${i+1} / ${STATIONS.length}</div>
  <h2>${st.range}｜${st.title}</h2>
  <div class="step-label"><b>1</b>選鏡頭：你想用什麼距離看這一段？</div>
  <div class="lenses">${Object.keys(LENS).map(k=>`<button class="lens-btn ${d.lens===k?"on":""}" data-lens="${k}"><span class="ln">${LENS[k].name}</span><span class="ld">${LENS[k].desc}</span></button>`).join("")}</div>
  <p class="lens-fb" id="lensFb">${lensFeedback(st,d)}</p>
  <div class="step-label"><b>2</b>戴上頭燈：在暗處拖曳光圈，點選你發現的關鍵句或意象</div>
  <div class="scene lens-${d.lens||"off"}" id="scene">
    <div class="text">${paraHTML(st)}</div><div class="shade"></div>
    <div class="off-msg">${d.lens?"":"先選一個鏡頭，頭燈就會亮起"}</div>
  </div>
  <div class="bag" id="bag"></div>
  <div class="step-label"><b>3</b>記錄：這一段裡，「獵人／我」……</div>
  <div class="rec-grid">
    <label class="field">做了什麼<input data-k="did" maxlength="200" value="${esc(d.did)}" placeholder="例：努力生火"></label>
    <label class="field">說了什麼<input data-k="said" maxlength="200" value="${esc(d.said)}" placeholder="可以抄一句"></label>
    <label class="field">感受到的氛圍<input data-k="mood" maxlength="200" value="${esc(d.mood)}" placeholder="例：安靜、有點不安"></label>
  </div>
  <div class="field">點一個句型開頭，接著寫下你的觀察與想法（寫多一點也沒關係）</div>
  <div class="chips">${st.starters.map((s,k)=>`<button class="chip" data-st="${k}">${esc(s)}</button>`).join("")}</div>
  <textarea id="thought" maxlength="3000" placeholder="從句型開始，或用自己的話寫……">${esc(d.thought)}</textarea>
  <nav class="st-nav">
    <button class="btn ghost" id="prevBtn">${i===0?"🏠 回主畫面":"上一個段落群"}</button>
    <span class="gate" id="gate"></span>
    <button class="btn" id="nextBtn">${i===STATIONS.length-1?"前往第二部分":"繼續前進"}</button>
  </nav></div>`;

  const scene=$("#scene");
  scene.style.setProperty("--r",(LENS[d.lens]?.r||120)+"px");
  let lx=scene.clientWidth/2, ly=90;
  const setLight=(x,y)=>{lx=x;ly=y;scene.style.setProperty("--x",x+"px");scene.style.setProperty("--y",y+"px")};
  setLight(lx,ly);
  const pos=e=>{const r=scene.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  scene.addEventListener("pointermove",e=>{const [x,y]=pos(e);setLight(x,y)});
  scene.addEventListener("pointerdown",e=>{const [x,y]=pos(e);setLight(x,y)});
  scene.addEventListener("click",e=>{
    const el=e.target.closest(".clue"); if(!el) return;
    if(!d.lens){toast("先選鏡頭，打開頭燈");return}
    const sr=scene.getBoundingClientRect(), R=LENS[d.lens].r;
    let near=false;
    for(const rc of el.getClientRects()){
      const cx=Math.max(rc.left,Math.min(lx+sr.left,rc.right)), cy=Math.max(rc.top,Math.min(ly+sr.top,rc.bottom));

    const ci=+el.dataset.ci;

    $("#gate").textContent=g.length?"還差："+g.join("、"):"";
    $("#nextBtn").disabled=!!g.length;
  }
  markClues();drawBag();gate();
  app.querySelectorAll(".lens-btn").forEach(b=>b.onclick=()=>{

    scene.querySelector(".off-msg").textContent="";
    $("#lensFb").innerHTML=lensFeedback(st,d);gate();
  });
  app.querySelectorAll("[data-k]").forEach(inp=>inp.addEventListener("input",()=>{d[inp.dataset.k]=inp.value;save()}));
  const ta=$("#thought");
  ta.addEventListener("input",()=>{d.thought=ta.value;save();gate()});
  app.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{
    const s=st.starters[+b.dataset.st];
    ta.value=ta.value.trim()?ta.value.replace(/\s*$/,"\n")+s:s;
    d.thought=ta.value;save();gate();ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
  });
  $("#prevBtn").onclick=()=>{if(i===0)location.hash="#";else go("s"+(i-1))};
  $("#nextBtn").onclick=()=>go(i===STATIONS.length-1?"p2":"s"+(i+1));
}

/* ---------- 第二部分 ---------- */
let shooting=false;
function renderP2(){
  const P=state.p2;
  const used=P.rounds.map(r=>r.id).concat(P.cur?[P.cur.id]:[]);
  app.innerHTML=`<div class="wrap">

function dartPos(s){
  const ring={3:[0,20],2:[38,56],1:[70,88],0:[44,80]}[s.acc||0];
  const r=ring[0]+(s.seed%100)/100*(ring[1]-ring[0]), ang=(s.seed*137)%360*Math.PI/180;
  return [100+r*Math.cos(ang),100+r*Math.sin(ang)];
}
function placeDart(s,old,animate){
  const t=$("#target"); if(!t) return;
  const el=document.createElement("div"); el.className="dart"+(old?" old":"")+(s.acc?"":" na");
  const [x,y]=dartPos(s);
  if(animate){el.style.left="100px";el.style.top="230px";t.appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.left=x+"px";el.style.top=y+"px"}))}

}
function fbHTML(s){
  const name=ARROW_NAME[s.arrow];

    if(s.err==="local") return `<div class="lv">箭已射出</div>本機模式（未連接後端）無法判定準度，僅供介面試用。直接寫下你的理由吧。`;

}
async function shoot(aid){

  const s={arrow:aid,acc:res.ok?res.acc:0,text:res.ok?res.text:"",err:res.ok?"":res.error,seed:Math.floor(Math.random()*997)};
  $("#target").querySelectorAll(".dart").forEach(d=>d.classList.add("old"));
  const prefix=n=>`我用「${n}」反駁：課文中`;

function norm(s){return String(s).replace(/[\s，。、：；！？「」『』（）…─—．‧,.!?;:'"()\-~～＿_]/g,"")}
const GRAMS=(()=>{const t=norm(Object.values(TEXT).join(""));const g=new Set();for(let i=0;i+4<=t.length;i++)g.add(t.substr(i,4));return g})();
function originality(text){
  let own=text||""; OPENINGS.forEach(o=>{own=own.split(o).join("")});
  const n=norm(own); if(!n.length) return {len:0,ratio:0};
  const cov=new Array(n.length).fill(false);
  for(let i=0;i+4<=n.length;i++) if(GRAMS.has(n.substr(i,4))) for(let j=i;j<i+4;j++) cov[j]=true;
  return {len:n.length,ratio:1-cov.filter(Boolean).length/n.length};
}
function stampType(o){if(o.len<20) return null; return o.ratio>=0.7?"guard":"learn"}

/* ---- 明信片繪圖 ---- */
function rr(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath()}
function ridge(x,base,amp,col,seed){
  x.fillStyle=col;x.beginPath();x.moveTo(0,800);
  for(let i=0;i<=1200;i+=10){const y=base-amp*(0.6*Math.sin(i/170+seed)+0.3*Math.sin(i/63+seed*2)+0.15*Math.sin(i/29+seed*3));x.lineTo(i,y)}
  x.lineTo(1200,800);x.closePath();x.fill();
}
function pine(x,px,py,h,col){x.fillStyle=col;for(let k=0;k<3;k++){const w=h*(0.42-k*0.09),y=py-k*h*0.28;x.beginPath();x.moveTo(px,y-h*0.42);x.lineTo(px-w,y);x.lineTo(px+w,y);x.closePath();x.fill()}}
function drawBg(x,k){
  x.save();
  if(k===0){
    const g=x.createLinearGradient(0,0,0,800);g.addColorStop(0,"#c7d1c6");g.addColorStop(.55,"#e9dcc4");g.addColorStop(1,"#d9c9ab");
    x.fillStyle=g;x.fillRect(0,0,1200,800);
    x.fillStyle="rgba(255,246,225,.85)";x.beginPath();x.arc(300,260,56,0,7);x.fill();
    ridge(x,380,60,"#a9b5a3",1);ridge(x,470,70,"#7f9282",2.3);ridge(x,570,60,"#566d5b",4.1);ridge(x,680,40,"#34473a",5.7);
    for(let i=0;i<14;i++){pine(x,20+i*44+(i%3)*9,760-(i%2)*18,90+(i%4)*14,"#22312a")}
  }else if(k===1){
    const g=x.createLinearGradient(0,0,0,800);g.addColorStop(0,"#17232b");g.addColorStop(1,"#2c3b35");
    x.fillStyle=g;x.fillRect(0,0,1200,800);
    x.fillStyle="rgba(240,232,210,.8)";for(let i=0;i<60;i++){x.beginPath();x.arc((i*197)%1200,(i*89)%380,(i%3)*0.7+0.6,0,7);x.fill()}
    x.fillStyle="#efe6cf";x.beginPath();x.arc(150,150,48,0,7);x.fill();
    ridge(x,560,50,"#22302a",3);ridge(x,690,30,"#17201b",6);
    x.translate(320,520);x.fillStyle="#0e1311";
    x.beginPath();x.ellipse(0,90,130,150,0,0,7);x.fill();
    x.beginPath();x.arc(0,-90,78,0,7);x.fill();
    x.beginPath();x.arc(-60,-152,26,0,7);x.arc(60,-152,26,0,7);x.fill();
    x.fillStyle="#3b3631";x.beginPath();x.ellipse(0,-62,34,26,0,0,7);x.fill();
    x.fillStyle="#0e1311";x.beginPath();x.ellipse(0,-74,12,8,0,0,7);x.fill();
    x.strokeStyle="#ece4cf";x.lineWidth=16;x.lineCap="round";x.lineJoin="round";
    x.beginPath();x.moveTo(-62,-6);x.lineTo(0,52);x.lineTo(62,-6);x.stroke();
  }else{
    const g=x.createLinearGradient(0,0,0,800);g.addColorStop(0,"#120d0b");g.addColorStop(1,"#2a1b13");
    x.fillStyle=g;x.fillRect(0,0,1200,800);
    const gl=x.createRadialGradient(300,600,10,300,600,420);gl.addColorStop(0,"rgba(240,150,70,.55)");gl.addColorStop(1,"rgba(240,150,70,0)");
    x.fillStyle=gl;x.fillRect(0,0,1200,800);
    for(let i=0;i<5;i++)pine(x,30+i*30,800,300+i*20,"#0b0807");
    pine(x,560,800,360,"#0b0807");
    x.save();x.translate(300,690);x.fillStyle="#4a3022";
    x.rotate(-.22);rr(x,-140,-14,280,30,12);x.fill();x.rotate(.44);rr(x,-140,-14,280,30,12);x.fill();x.restore();
    const flame=(w,h,c)=>{x.fillStyle=c;x.beginPath();x.moveTo(300-w,680);x.bezierCurveTo(300-w,680-h*.5,300-w*.2,680-h*.7,300,680-h);x.bezierCurveTo(300+w*.25,680-h*.65,300+w,680-h*.45,300+w,680);x.closePath();x.fill()};
    flame(95,250,"#d9772f");flame(68,190,"#f0a74a");flame(40,120,"#fbdc95");

function wrapLines(x,text,maxW){
  const out=[],NO_START="，。、：；！？」』）…";

  return out;
}
function drawStamp(x,type){

  x.fillStyle="#f7f2e8";for(let i=X;i<=X+W;i+=11){x.beginPath();x.arc(i,Y,4,0,7);x.arc(i,Y+H,4,0,7);x.fill()}
  for(let j=Y;j<=Y+H;j+=11){x.beginPath();x.arc(X,j,4,0,7);x.arc(X+W,j,4,0,7);x.fill()}
  const c=type==="guard"?"#4a6650":"#b07a3c";
  x.fillStyle=c;x.fillRect(X+9,Y+9,W-18,H-18);x.fillStyle="#f6efe0";
  if(type==="guard"){pine(x,X+W/2,Y+86,70,"#f6efe0");x.fillRect(X+W/2-4,Y+86,8,14)}
  else{x.beginPath();x.moveTo(X+22,Y+96);x.lineTo(X+50,Y+44);x.lineTo(X+68,Y+72);x.lineTo(X+78,Y+58);x.lineTo(X+92,Y+96);x.closePath();x.fill();
    x.fillStyle=c;x.beginPath();x.moveTo(X+56,Y+96);x.quadraticCurveTo(X+48,Y+80,X+56,Y+68);x.quadraticCurveTo(X+64,Y+80,X+56,Y+96);x.fill()}
  x.fillStyle="#f6efe0";x.textAlign="center";x.font=(type==="guard"?'bold 15px ':'bold 13px ')+'"Noto Serif TC",serif';
  x.fillText(STAMP_NAME[type],X+W/2,Y+H-22);x.restore();
}
function drawPostmark(x,type){

/* ---- 學習歷程文字 ---- */
function buildText(stu,rec,ts){
  const d=ts?new Date(ts):new Date(), L=[];
  L.push("【瓦歷斯‧諾幹〈獵人〉學習歷程】");
  L.push(`班級：${stu.cls}　座號：${stu.seat}　姓名：${stu.name}　日期：${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`);
  L.push("","━━ 第一部分｜文章、手電筒、鏡頭 ━━");
  STATIONS.forEach((st,k)=>{
    const r=rec.p1[k]||{clues:[]};
    L.push(`▍${st.range}｜${st.title}`,`鏡頭：${r.lens?LENS[r.lens].name:"（未選）"}`,
      `照亮的線索：${r.clues.length?r.clues.map(ci=>"「"+st.clues[ci].t.replace(/^「|」$/g,"")+"」").join("、"):"（無）"}`,
      `做了什麼：${r.did||"—"}`,`說了什麼：${r.said||"—"}`,`氛圍：${r.mood||"—"}`,`我的想法：${r.thought||"—"}`,"");
  });
  L.push("━━ 第二部分｜獵人的遊戲 ━━");
  rec.p2.forEach((r,k)=>{const c=CLAIMS[r.id];L.push(`▍第 ${k+1} 回｜${c.tag}（${c.sdg.join("、")}）`,`假獵人說：「${c.say}」`,`我的箭：${r.shots.map(s=>ARROW_NAME[s.arrow]).join(" → ")}`,`反駁理由：${r.reason}`,"")});
  if(!rec.p2.length) L.push("（尚未完成）","");
  L.push("━━ 第三部分｜森林明信片 ━━",`底圖：${BGS[rec.p3.bg]}`,TO_LINE,rec.p3.text||"（尚未書寫）",
    `與課文不同的文字比例：約 ${Math.round((rec.p3.originality||0)*100)}%　郵票：${STAMP_NAME[rec.p3.stamp]||"（字數未達）"}`);
  return L.join("\n");
}

/* ============ 個人報告書 ============ */
function reportHTML(rep,opt={}){
  const {student:s,rec,ana}=rep;
  const lensMatch=rec.p1.filter((x,i)=>x.lens&&x.lens===STATIONS[i].lens).length;
  const p1Own=rec.p1.map((x,i)=>ownLen(x.thought,STATIONS[i].starters));
  const best=p1Own.indexOf(Math.max(...p1Own));
  const totalShots=rec.p2.reduce((t,r)=>t+r.shots.length,0);
  const adjusted=rec.p2.filter(r=>r.shots.length>1).length;
  const text=rec.p3.text||"";
  const ratio=rec.p3.originality||0;
  const parts=ana.parts||[false,false,false];
  const lv=(ok,ic,name)=>`<div class="level ${ok?"ok":""}"><div class="ic">${ok?ic:"○"}</div><b>${name}</b><div class="note">${ok?"已完成":"未完成"}</div></div>`;
  // 優勢
  const good=[];
  if(ana.p1Words>=400) good.push("你在第一部分寫得很充實，把看見的、感受到的都記了下來。");
  if(ana.clues>=14) good.push(`你很會找線索，一共照亮了 ${ana.clues} 條關鍵句。`);
  if(p1Own[best]>=40) good.push(`寫得最用心的是「${STATIONS[best].title}」這一段，看得出你真的停下來想了。`);
  if(adjusted) good.push(`第二部分有 ${adjusted} 回，你願意調整角度再射一次——換個角度想，就是思考。`);
  if(ratio>=0.7&&clen(text)>=20) good.push("明信片大多用自己的話寫成，這是屬於你的回應。");
  else if(/「/.test(text)) good.push("你懂得借用課文金句，把老獵人的話帶進自己的信裡。");
  if(!good.length) good.push("你完整走過了這趟山林旅程。");
  // 可以加強
  const more=[];
  const weak=p1Own.map((n,i)=>[n,i]).filter(([n])=>n<25).map(([,i])=>STATIONS[i].title);
  if(weak.length) more.push(`「${weak.slice(0,3).join("」「")}」的想法可以再多寫一點：除了感覺，也試著說說「為什麼」。`);
  if(rec.p2.some(r=>clen(r.reason)<25)) more.push("反駁理由可以加上課文證據，用「課文中……，所以我認為……」把理由說完整。");
  if(ratio<0.7&&clen(text)>=20) more.push("明信片可以試著多寫一段自己的話，不必只靠課文金句。");
  // 開放題回饋
  const fb=[];
  if(/心軟|放下|停|小山豬|沒有獵/.test(text)) fb.push("你看見了「我」心軟背後的意義：放下，也可以是一種勇敢。");
  if(/禁忌|規矩|篝火|番刀/.test(text)) fb.push("你注意到山林裡的規矩，並試著理解它們的用意。");
  if(/黑熊|保育|山林|下一代|小孩|未來的山/.test(text)) fb.push("你把故事連到山林與下一代的未來。");
  if(/以後|將來|下次|未來|如果我/.test(text)) fb.push("你把山上的經驗帶回自己的生活，這是這張明信片最珍貴的地方。");
  else fb.push("可以再加一句：以後遇到相似的處境（想要、卻該放手的時候），你會怎麼做？");
  // 下一步
  const next=[];
  next.push(weak.length?`回到「${weak[0]}」再讀一次，換一個鏡頭看看，會不會看到不一樣的東西？`:"挑一段你最有感覺的課文，換一個鏡頭重讀，寫下新的發現。");
  next.push("想一想：在你的生活裡，有沒有像「最後的山豬」一樣，需要你忍住、留給別人的東西？");
  next.push("把你的明信片念給同學聽，聽聽別人怎麼安頓那個「我」。");
  // 第二部分（公布後）
  let p2detail="";
  if(rep.published&&rep.answers){
    p2detail=rec.p2.map((r,k)=>{const a=rep.answers[r.id]||{},ar=(ana.rounds||[])[k]||{};const fin=ar.final;
      return `<div class="ans-row"><b>${CLAIMS[r.id].tag}</b>：你的箭 ${r.shots.map(s=>ARROW_NAME[s.arrow].replace("之箭","")).join(" → ")}${fin?`（最後落在<b>${ACC_NAME[fin]}</b>）`:""}<br>最能切中的角度：${(a.best||[]).join("、")}<br><span class="mute">${esc(a.note||"")}</span></div>`}).join("");
  }
  return `<div class="report">
   <h2>我的山林旅程報告書</h2>
   <div class="meta">${esc(s.cls)} 班 ${esc(s.seat)} 號 ${esc(s.name)}　｜　完成時間：${fmtTime(rep.ts)}　｜　用時：${fmtDur(rec.durationSec)}</div>
   <section><h3>我的旅程</h3><div class="levels">${lv(parts[0],"🔦","一｜頭燈與鏡頭")}${lv(parts[1],"🏹","二｜獵人的遊戲")}${lv(parts[2],"✉️","三｜森林明信片")}</div></section>
   <section><h3>各部分表現</h3><ul>
     <li><b>第一部分</b>：照亮 ${ana.clues} 條線索；有 ${lensMatch} 段的鏡頭和作者相近（鏡頭沒有對錯）；書寫約 ${ana.p1Words} 字。</li>
     <li><b>第二部分</b>：完成 ${rec.p2.length} 回，共射出 ${totalShots} 支箭，其中 ${adjusted} 回調整過角度；反駁理由約 ${ana.p2Words} 字。</li>
     <li><b>第三部分</b>：明信片約 ${ana.p3Words} 字，和課文不同的文字比例約 ${Math.round(ratio*100)}%，郵票：${STAMP_NAME[rec.p3.stamp]||"—"}。</li>
   </ul></section>
   <section><h3>我的書寫特色</h3><p><b>做得好的地方</b></p><ul>${good.map(g=>`<li>${esc(g)}</li>`).join("")}</ul>
     ${more.length?`<p><b>可以再加強</b></p><ul>${more.map(g=>`<li>${esc(g)}</li>`).join("")}</ul>`:""}</section>
   <section><h3>給我的明信片的回饋</h3><ul>${fb.map(g=>`<li>${esc(g)}</li>`).join("")}</ul></section>
   ${p2detail?`<section><h3>獵人的遊戲：老師公布的解析</h3>${p2detail}</section>`:""}
   <section><h3>下一步可以這樣做</h3><ul>${next.map(g=>`<li>${esc(g)}</li>`).join("")}</ul></section>
  </div>`;
}

function allAttempts(rows){
  const list=[];rows.forEach(b=>(b.attempts||[]).forEach(a=>list.push({b,a})));
  return list.sort((x,y)=>y.a.ts.localeCompare(x.a.ts));
}
function teacherHTML(rows){
  const D=T.data;
  let att=allAttempts(rows);
  if(T.seat) att=att.filter(x=>String(x.b.seat)===T.seat);
  if(T.onlyFlag) att=att.filter(x=>x.a.flags.length);
  // 第二部分分析
  const cl=CLAIMS.map(c=>({c,n:0,first3:0,fin3:0,firstArrow:{}}));
  // 第一部分鏡頭
  const lens=STATIONS.map(()=>({wide:0,mid:0,macro:0}));
  rows.forEach(b=>{const a=b.attempts.at(-1);
    a.rec.p1.forEach((x,i)=>{if(x.lens)lens[i][x.lens]++});
    a.rec.p2.forEach((r,k)=>{const s=cl[r.id];s.n++;const ar=(a.ana.rounds||[])[k]||{};if(ar.accs&&ar.accs[0]===3)s.first3++;if(ar.final===3)s.fin3++;const f=r.shots[0]&&r.shots[0].arrow;if(f)s.firstArrow[f]=(s.firstArrow[f]||0)+1});
  });
  const pct=(a,n)=>n?Math.round(a/n*100):0;
  const colors={wide:"#7f9282",mid:"#bf6b33",macro:"#34493a"};
  return `
  <h3 style="margin-top:34px">教師區</h3>
  <div class="card tools">
    <label><input type="checkbox" id="pubT" ${D.published?"checked":""}> 公布解答（學生報告書顯示第二部分解析）</label>
    <label>提醒門檻：用時少於 <input type="number" id="thr" value="${D.threshold}" min="0"> 秒 <button class="btn sm ghost" id="thrSave">儲存</button></label>
    <button class="btn sm ghost" id="csv">匯出 ${esc(T.cls)} 班 CSV</button>
    <button class="btn sm ghost" id="impBtn">匯入成績碼</button>
    <button class="btn sm danger" id="clr">清除 ${esc(T.cls)} 班資料</button>
  </div>
  <div id="impBox"></div>

  <h3 style="margin-top:28px">作答紀錄（${esc(T.cls)} 班，最新在上）</h3>
  <div class="tools" style="margin-bottom:10px">
    <label>座號 <input type="number" id="fSeat" value="${esc(T.seat)}" min="1" max="60" style="width:80px;border:1px solid var(--line);border-radius:8px;padding:6px 8px"></label>
    <label><input type="checkbox" id="fFlag" ${T.onlyFlag?"checked":""}> 只看需要留意的紀錄</label>
    <button class="btn sm ghost" id="cpTbl">複製表格（貼到 Excel）</button>
  </div>
  <p class="note">「用時偏短」「書寫偏少」只是提醒，請老師確認。</p>
  <div class="tbl-wrap"><table class="tbl" id="recTbl"><tr><th>交出時間</th><th>座號</th><th>姓名</th><th>用時</th><th>字數</th><th>靶心</th><th>郵票</th><th>提醒</th><th>操作</th></tr>
  ${att.map(({b,a})=>`<tr class="${a.flags.length?"flag":""}"><td>${fmtTime(a.ts)}</td><td>${b.seat}</td><td>${esc(a.name)}</td><td>${fmtDur(a.rec.durationSec)}</td><td>${a.ana.words}</td><td>${a.ana.bulls}</td><td>${STAMP_NAME[a.rec.p3.stamp]||"—"}</td><td>${a.flags.join("、")}</td>
   <td style="white-space:nowrap"><button class="btn sm ghost" data-view="${b.seat}|${a.ts}">報告書</button> <button class="btn sm ghost" data-redo="${b.seat}">${b.redo?"取消重做":"開放重做"}</button> <button class="btn sm danger" data-del="${b.seat}|${a.ts}">刪除</button></td></tr>`).join("")||'<tr><td colspan="9" class="mute">沒有符合的紀錄</td></tr>'}
  </table></div>

  <h3 style="margin-top:28px">第二部分：各假獵人說法</h3>
  <div class="tbl-wrap"><table class="tbl"><tr><th>說法</th><th>回合數</th><th>第一箭靶心率</th><th>最後靶心率</th><th>最常見的第一箭</th><th>最能切中的角度</th></tr>
  ${cl.map(s=>{const top=Object.entries(s.firstArrow).sort((a,b)=>b[1]-a[1])[0];const ans=(D.answers||{})[s.c.id];
    return `<tr><td>${s.c.tag}</td><td>${s.n}</td><td>${pct(s.first3,s.n)}%</td><td>${pct(s.fin3,s.n)}%</td><td>${top?ARROW_NAME[top[0]]+"（"+top[1]+"）":"—"}</td><td>${ans?ans.best.join("、"):'<span class="err">後端未貼答案</span>'}</td></tr>`}).join("")}
  </table></div>

  <h3 style="margin-top:28px">第一部分：鏡頭選擇</h3>
  <div class="legend">${Object.keys(colors).map(k=>`<i style="background:${colors[k]}"></i>${LENS[k].name}`).join("")}　（★ 為作者較接近的鏡頭，僅供討論）</div>
  <div class="bars">${STATIONS.map((st,i)=>{const L=lens[i],n=L.wide+L.mid+L.macro;
    return `<div class="b"><span>${st.title} ★${LENS[st.lens].name}</span><div class="stack">${Object.keys(colors).map(k=>`<i style="width:${n?L[k]/n*100:0}%;background:${colors[k]}"></i>`).join("")}</div><span>${n} 人</span></div>`}).join("")}</div>

  <h3 style="margin-top:28px">學生診斷</h3>
  <div class="tools"><select id="diag" style="border:1px solid var(--line);border-radius:8px;padding:8px">${rows.slice().sort((a,b)=>a.seat-b.seat).map(b=>`<option value="${b.seat}">${b.seat} 號 ${esc(b.name)}</option>`).join("")}</select><button class="btn sm" id="diagBtn">開啟報告書</button></div>
  <p class="note" style="margin-top:22px">學生資料在 Google 試算表；密碼與答案只在 Apps Script，GitHub 上沒有。</p>`;
}
function bindTeacher(rows){
  const D=T.data, cls=T.cls;
  const find=seat=>rows.find(b=>String(b.seat)===String(seat));
  const act=async(action,data,msg)=>{const r=await api(action,{password:T.pw,...data});if(!r.ok){toast(errMsg(r.error));return false}if(msg)toast(msg);await loadList();return true};
  $("#pubT").onchange=e=>act("setting",{key:"published",value:e.target.checked},e.target.checked?"已公布解答":"已取消公布");
  $("#thrSave").onclick=()=>act("setting",{key:"threshold",value:+$("#thr").value},"門檻已更新");
  $("#clr").onclick=()=>{if(confirm(`確定要清除 ${cls} 班所有資料嗎？此動作無法復原。`)&&confirm("再確認一次：真的要清除嗎？"))act("clearClass",{cls},"已清除")};
  $("#fSeat").onchange=e=>{T.seat=e.target.value.trim();drawScores()};
  $("#fFlag").onchange=e=>{T.onlyFlag=e.target.checked;drawScores()};
  $("#cpTbl").onclick=()=>{
    const tr=[...$("#recTbl").querySelectorAll("tr")].map(r=>[...r.children].slice(0,8).map(c=>c.innerText.replace(/\t|\n/g," ")).join("\t")).join("\n");
    copyText(tr,"已複製，可以貼到 Excel");
  };
  $("#csv").onclick=()=>{
    const cell=v=>{let s=String(v??"");if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
    const head=["交出時間","班級","座號","姓名","用時(秒)","書寫總字數","靶心回合","郵票","原創比例","提醒","第一部分想法","第二部分反駁理由","明信片"];
    const lines=[head.map(cell).join(",")];
    allAttempts(rows).forEach(({b,a})=>lines.push([fmtTime(a.ts),b.cls,b.seat,a.name,a.rec.durationSec,a.ana.words,a.ana.bulls,STAMP_NAME[a.rec.p3.stamp]||"",a.rec.p3.originality,a.flags.join("、"),
      a.rec.p1.map((x,i)=>`【${STATIONS[i].title}】${x.thought}`).join("\n"),a.rec.p2.map(r=>`【${CLAIMS[r.id].tag}】${r.reason}`).join("\n"),a.rec.p3.text].map(cell).join(",")));
    const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`獵人_${cls}班.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  };
  $("#impBtn").onclick=()=>{$("#impBox").innerHTML=`<div class="card" style="margin-top:10px"><div class="field">貼上學生給的成績碼</div><textarea id="impCode" style="min-height:80px"></textarea><div class="actions"><button class="btn sm" id="impGo">匯入</button></div></div>`;
    $("#impGo").onclick=()=>act("import",{code:$("#impCode").value},"已匯入")};
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const [seat,ts]=b.dataset.del.split("|");if(confirm(`確定刪除 ${seat} 號 ${fmtTime(ts)} 這次紀錄？`))act("deleteAttempt",{cls,seat:+seat,ts},"已刪除")});
  app.querySelectorAll("[data-redo]").forEach(b=>b.onclick=()=>{const s=find(b.dataset.redo);act("redo",{cls,seat:s.seat,value:!s.redo},s.redo?"已取消重做":"已開放重做")});
  const view=(b,a)=>{
    const rep={student:{cls:b.cls,seat:b.seat,name:a.name},ts:a.ts,rec:a.rec,ana:a.ana,published:true,answers:D.answers};
    openModal(`<div class="noprint" style="display:flex;gap:10px;justify-content:flex-end"><button class="btn sm" id="mPrt">列印</button><button class="btn sm ghost" id="mTxt">複製學習歷程</button><button class="btn sm ghost" id="mCl">關閉</button></div>${reportHTML(rep)}`,true);
    $("#mPrt").onclick=()=>window.print();$("#mCl").onclick=closeModal;
    $("#mTxt").onclick=()=>copyText(buildText(rep.student,a.rec,a.ts),"已複製");
  };
  app.querySelectorAll("[data-view]").forEach(btn=>btn.onclick=()=>{const [seat,ts]=btn.dataset.view.split("|");const b=find(seat);view(b,b.attempts.find(a=>a.ts===ts))});
  const dg=$("#diagBtn"); if(dg) dg.onclick=()=>{const b=find($("#diag").value);view(b,b.attempts.at(-1))};
}

/* ============ 大屏 ============ */
let screenTimer=null, screenCls="";
async function screenPage(){
  topbar("screen");document.body.classList.add("screen-mode");
  app.innerHTML=`<div class="scr" id="scr"><p style="font-size:24px">讀取中……</p></div>`;
  await drawScreen();
  screenTimer=setInterval(drawScreen,15000);
}
async function drawScreen(){
  const res=await api("stats",{cls:screenCls});
  if(!res.ok){$("#scr").innerHTML=`<p class="err" style="font-size:24px">${esc(errMsg(res.error))}</p>`;return}
  const classes=Object.keys(res.classes).sort();
  if(!screenCls&&classes.length){screenCls=classes.sort((a,b)=>res.classes[b]-res.classes[a])[0];return drawScreen()}
  const colors={wide:"#8aa08e",mid:"#c46f30",macro:"#2f4a37"};
  const now=new Date();
  $("#scr").innerHTML=`
   <div class="scr-head"><h1>〈獵人〉山林旅程</h1>
     <select id="scrCls">${classes.map(c=>`<option ${c===screenCls?"selected":""}>${esc(c)}</option>`).join("")||"<option>—</option>"}</select><span style="font-size:26px">班即時進度</span>
     <a href="#scores" style="margin-left:auto;font-size:20px">🏠 離開大屏</a></div>
   <div class="scr-nums">
     <div class="scr-num"><div class="v">${res.count}</div><div class="k">已交出學習歷程</div></div>
     <div class="scr-num"><div class="v">${res.finished}</div><div class="k">三個部分全部完成</div></div>
     <div class="scr-num"><div class="v">${res.stamps.guard}</div><div class="k">森林守護者郵票</div></div>
     <div class="scr-num"><div class="v">${res.stamps.learn}</div><div class="k">山林見習獵人郵票</div></div>
   </div>
   <div class="scr-grid">
     <div class="scr-panel"><h2>第一部分：大家用什麼鏡頭看？</h2>
       <div style="font-size:18px;color:#4b524d;margin-bottom:6px">${Object.keys(colors).map(k=>`<span style="display:inline-block;width:16px;height:16px;border-radius:3px;background:${colors[k]};margin:0 6px 0 14px;vertical-align:middle"></span>${LENS[k].name}`).join("")}</div>
       ${STATIONS.map((st,i)=>{const L=res.lens[i],n=L.wide+L.mid+L.macro;return `<div class="scr-row"><span>${st.title}</span><div class="stack">${Object.keys(colors).map(k=>`<i style="width:${n?L[k]/n*100:0}%;background:${colors[k]}"></i>`).join("")}</div></div>`}).join("")}
     </div>
     <div class="scr-panel"><h2>第二部分：射中靶心的比例</h2>
       ${res.claims.map(c=>{const p=c.n?Math.round(c.bulls/c.n*100):0;return `<div class="scr-row"><span>${c.tag}</span><div class="t"><i style="width:${p}%"></i><em>${c.n?p+"%":"—"}</em></div></div>`}).join("")}
     </div>
     <div class="scr-panel"><h2>書寫最多</h2><ol class="scr-top">${res.top.map(t=>`<li>${t.seat} 號 ${esc(t.name)}　${t.words} 字</li>`).join("")||"<li>—</li>"}</ol></div>
   </div>
   <div class="scr-foot"><span>每 15 秒自動更新</span><span>更新時間 ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}:${String(now.getSeconds()).padStart(2,"0")}</span></div>`;
  $("#scrCls").onchange=e=>{screenCls=e.target.value;drawScreen()};
}

/* ============ 啟動 ============ */
route();
if(document.fonts&&document.fonts.load){document.fonts.load('27px "Noto Serif TC"').then(()=>{if(location.hash==="#quiz"&&state.step==="p3"&&!state.submitted)refresh()}).catch(()=>{})}
</script>
